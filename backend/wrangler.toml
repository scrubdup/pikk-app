name = "pikk-api"
main = "src/index.ts"
compatibility_date = "2026-11-19"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# D1 Database
# 1. npx wrangler d1 create pikk-db
# 2. Paste the real database_id below
# 3. npm run db:migrate
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "pikk-db"
database_id = "local-pikk-db"  # <-- replace with real ID
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# R2 Bucket (Vault)
# REQUIRED for real uploads/downloads:
#   1. npx wrangler r2 bucket create pikk-vault
#   2. Uncomment the three lines below
#   3. Redeploy
# ---------------------------------------------------------------------------
# [[r2_buckets]]
# binding = "VAULT_BUCKET"
# bucket_name = "pikk-vault"

[vars]
ENVIRONMENT = "development"
