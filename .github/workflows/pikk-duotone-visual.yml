name: PIKK Duotone Controls Guard
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/visual-review-duotone.mjs'
      - '.github/workflows/pikk-duotone-visual.yml'
permissions:
  contents: read
jobs:
  duotone-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install app and screenshot browser
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify production build
        run: npm run build
      - name: Start local PIKK app
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/pikk-duotone-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pikk-duotone-vite.log
          exit 1
      - name: Every control on each tab combines red and blue
        run: node scripts/visual-review-duotone.mjs
