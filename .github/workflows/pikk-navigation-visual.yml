name: PIKK Navigation Visual Review

on:
  pull_request:
    paths:
      - 'src/data.js'
      - 'src/main.js'
      - 'src/styles.css'
      - 'tests/**'
      - '.github/workflows/pikk-navigation-visual.yml'

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install app dependencies
        run: npm ci
      - name: Install screenshot browser
        run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Start Vite preview
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/pikk-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pikk-vite.log
          exit 1
      - name: Capture actual Home navigation on mobile and desktop
        run: |
          mkdir -p visual-review
          npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size "390,844" --wait-for-timeout 6500 --full-page "http://127.0.0.1:5173/#/home" visual-review/home-mobile.png
          npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size "1440,900" --wait-for-timeout 6500 --full-page "http://127.0.0.1:5173/#/home" visual-review/home-desktop.png
          npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size "390,844" --wait-for-timeout 6500 --full-page "http://127.0.0.1:5173/#/games" visual-review/arcade-mobile.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pikk-home-nav-review
          path: visual-review/*.png
          if-no-files-found: warn
