name: PIKK Battles Vote Tap Target Review
on:
  pull_request:
    paths:
      - 'src/pages/giftbattles.js'
      - 'src/store.js'
      - 'src/*.css'
      - 'src/**/*.css'
      - 'scripts/visual-review-battles-taps.mjs'
      - '.github/workflows/pikk-battles-visual.yml'
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build PIKK
        run: npm run build
      - name: Measure rendered Battles vote button heights at 360/390/430
        run: node scripts/visual-review-battles-taps.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pikk-battles-tap-review
          path: visual-review/battles-*.png
          if-no-files-found: warn
