name: PIKK Video Category Filter Visual Review
on:
  pull_request:
    paths:
      - 'src/pages/shells.js'
      - 'src/data.js'
      - 'tests/pikk-video-layout.test.mjs'
      - 'scripts/visual-review-video-filters.mjs'
      - '.github/workflows/pikk-video-filters-visual.yml'
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build PIKK
        run: npm run build
      - name: Verify Videos filters at mobile and desktop sizes
        run: node scripts/visual-review-video-filters.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pikk-video-filter-visual-review
          path: visual-review/videos-*.png
          if-no-files-found: warn
