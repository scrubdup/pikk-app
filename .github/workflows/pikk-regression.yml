name: PIKK Regression Guard (no deploy)

on:
  push:
    branches: [pikk-build-regression-guards]
  pull_request:
    branches: [main, pikk-restoration-from-main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Preserve developed app features
        run: npm test
      - name: Compile app without deploying
        run: npm run build
