name: PIKK Support FAQ Search Visual Review
on:
  pull_request:
    paths:
      - 'src/pages/support.js'
      - 'src/support.css'
      - 'tests/pikk-support-search-feedback.test.mjs'
      - 'scripts/visual-review-support-search.mjs'
      - '.github/workflows/pikk-support-search-visual.yml'
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run tests and compile app
        run: |
          npm test
          npm run build
      - name: Verify support FAQ filtering and clear on mobile and desktop
        run: node scripts/visual-review-support-search.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pikk-support-faq-search-visual-review
          path: visual-review/support-faq-*.png
          if-no-files-found: error
