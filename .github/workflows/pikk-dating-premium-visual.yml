name: PIKK Dating Premium Visual Review
on:
  pull_request:
    paths:
      - 'src/pages/dating.js'
      - 'src/dating-premium.css'
      - 'src/main.js'
      - 'tests/pikk-dating-premium.test.mjs'
      - 'scripts/visual-review-dating-premium.mjs'
      - '.github/workflows/pikk-dating-premium-visual.yml'
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build PIKK
        run: npm run build
      - name: Check mobile and desktop Dating visuals and navigation
        run: node scripts/visual-review-dating-premium.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pikk-dating-premium-screenshots
          path: visual-review/dating-premium-*.png
          if-no-files-found: warn
