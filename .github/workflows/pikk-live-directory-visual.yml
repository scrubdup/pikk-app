name: PIKK Live Grouped Directory Visual Review

on:
  pull_request:
    paths:
      - 'src/live-discovery.js'
      - 'src/pages/live.js'
      - 'src/styles.css'
      - 'tests/pikk-live-grouped-discovery.test.mjs'
      - 'scripts/visual-review-live-directory.mjs'
      - '.github/workflows/pikk-live-directory-visual.yml'

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install app dependencies
        run: npm ci
      - name: Install screenshot runner and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test and build
        run: |
          npm test
          npm run build
      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/pikk-live-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pikk-live-vite.log
          exit 1
      - name: Verify grouped Live directory on mobile and desktop
        run: node scripts/visual-review-live-directory.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pikk-live-grouped-directory-screenshots
          path: visual-review/pikk-live-*.png
          if-no-files-found: warn
