name: PIKK Seven Tab Menu Visual Review
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/section-menus.js'
      - 'src/create-menu.js'
      - 'src/music-menu.js'
      - 'src/main.js'
      - 'src/styles.css'
      - 'scripts/visual-review-tab-menus.mjs'
      - '.github/workflows/pikk-tab-menus-visual.yml'
permissions:
  contents: read
jobs:
  all-seven-menus:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install app and screenshot browser
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify production build
        run: npm run build
      - name: Start local PIKK app
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/pikk-tab-menus-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pikk-tab-menus-vite.log
          exit 1
      - name: Verify every bottom tab against approved Create menu
        run: node scripts/visual-review-tab-menus.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pikk-seven-tab-menu-screenshots
          path: visual-review/tabs-*.png
          if-no-files-found: warn
