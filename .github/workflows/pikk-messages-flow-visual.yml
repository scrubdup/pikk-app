name: PIKK Messages Conversation Flow Visual Review
on:
  pull_request:
    paths:
      - 'src/pages/messages.js'
      - 'src/messages-premium.css'
      - 'src/main.js'
      - 'tests/pikk-messages-premium.test.mjs'
      - 'scripts/visual-review-messages-flow.mjs'
      - '.github/workflows/pikk-messages-flow-visual.yml'
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build PIKK
        run: npm run build
      - name: Verify Messages guest, inbox, contacts, thread and team on mobile and desktop
        run: node scripts/visual-review-messages-flow.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pikk-messages-flow-visual-review
          path: visual-review/messages-flow-*.png
          if-no-files-found: warn
