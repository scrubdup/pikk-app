name: PIKK Shop Visual Review
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/pikk-shop.js'
      - 'src/styles.css'
      - 'scripts/visual-review-shop.mjs'
      - 'tests/pikk-shop-reference-visual.test.mjs'
      - '.github/workflows/pikk-shop-visual.yml'
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install app and browser
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start PIKK local preview
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/pikk-shop-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pikk-shop-vite.log
          exit 1
      - name: Check authentic Shop layout, functionality and screenshots
        run: node scripts/visual-review-shop.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pikk-shop-visual-review
          path: visual-review/shop-*.png
          if-no-files-found: warn
