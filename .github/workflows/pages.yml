name: Deploy GitHub Pages

# Owner release gate: building and testing a branch must never publish it.
# Deployment requires an explicit manual workflow dispatch after review.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Verify preserved PIKK features
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /pikk-app/
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_PIKK_API_BASE: ${{ vars.PIKK_API_BASE }}
      - name: SPA fallback 404.html
        run: cp dist/index.html dist/404.html
      - name: Publish built app to existing gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: false
          enable_jekyll: false
      - name: Verify public PIKK Pages CDN serves this exact build
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="https://scrubdup.github.io/pikk-app/"
          for attempt in $(seq 1 24); do
            html="$(curl -fLsS --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' "${base}?verify=${EXPECTED_SHA}" || true)"
            bundle="$(printf '%s' "$html" | grep -oE '/pikk-app/assets/index-[[:alnum:]_-]+\.js' | head -n 1 || true)"
            if [[ -n "$bundle" ]]; then
              js="$(curl -fLsS --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://scrubdup.github.io${bundle}" || true)"
              if [[ "$js" == *"$EXPECTED_SHA"* ]]; then
                echo "Public Pages verified: ${base} serves ${bundle} built from ${EXPECTED_SHA}"
                exit 0
              fi
            fi
            echo "Attempt ${attempt}: waiting for the public CDN to serve ${EXPECTED_SHA}"
            sleep 15
          done
          echo "::error::Public Pages delivery of ${EXPECTED_SHA} could not be verified"
          exit 1
