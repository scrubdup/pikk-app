name: PIKK Signup Visual Review
on:
  pull_request:
    paths:
      - 'src/pages/shells.js'
      - 'src/styles.css'
      - 'tests/pikk-signup-brand.test.mjs'
      - 'scripts/visual-review-signup.mjs'
      - '.github/workflows/pikk-signup-visual.yml'
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test signup branding and existing contracts
        run: npm test
      - name: Build PIKK
        run: npm run build
      - name: Verify signup at 390px and 1440px
        run: node scripts/visual-review-signup.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pikk-signup-visual-review
          path: visual-review/signup-*.png
          if-no-files-found: warn
