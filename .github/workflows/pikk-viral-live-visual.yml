name: PIKK Viral Live Preview Visual Review
on:
  pull_request:
    paths:
      - 'src/pages/viral-live.js'
      - 'src/viral-live.css'
      - 'src/pages/live.js'
      - 'src/main.js'
      - 'tests/pikk-viral-live-preview.test.mjs'
      - 'scripts/visual-review-viral-live.mjs'
      - '.github/workflows/pikk-viral-live-visual.yml'
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Regression tests and production build
        run: |
          npm test
          npm run build
      - name: Start production build under the GitHub Pages project base
        run: |
          npm run preview -- --host 127.0.0.1 --port 5173 > /tmp/pikk-viral-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/pikk-app/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pikk-viral-vite.log
          exit 1
      - name: Verify mobile and desktop route, interaction and screenshots
        env:
          PIKK_VISUAL_BASE_URL: http://127.0.0.1:5173/pikk-app/
        run: node scripts/visual-review-viral-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pikk-viral-live-preview-screenshots
          path: visual-review/pikk-viral-live-*.png
          if-no-files-found: warn
