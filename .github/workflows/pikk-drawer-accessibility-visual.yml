name: PIKK Drawer Keyboard and Visual Review

on:
  pull_request:
    paths:
      - 'index.html'
      - 'src/main.js'
      - 'src/drawer-state.js'
      - 'scripts/verify-drawer-visual.mjs'
      - 'tests/pikk-drawer-accessibility.test.mjs'
      - '.github/workflows/pikk-drawer-accessibility-visual.yml'

jobs:
  drawer-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify regression and production build
        run: |
          npm test
          npm run build
      - name: Install Chromium test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local app
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/pikk-drawer-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pikk-drawer-vite.log
          exit 1
      - name: Verify and capture open drawer at mobile and desktop widths
        run: node scripts/verify-drawer-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pikk-drawer-keyboard-visuals
          path: visual-review/*.png
          if-no-files-found: warn
