name: PIKK Clippers Visual Review
on:
  pull_request:
    paths:
      - 'src/pages/clippers.js'
      - 'src/clippers-premium.css'
      - 'src/main.js'
      - 'tests/pikk-clippers-premium.test.mjs'
      - 'scripts/visual-review-clippers.mjs'
      - '.github/workflows/pikk-clippers-visual.yml'
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build PIKK
        run: npm run build
      - name: Verify Clippers on mobile and desktop
        run: node scripts/visual-review-clippers.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pikk-clippers-visual-review
          path: visual-review/clippers-*.png
          if-no-files-found: warn
