name: PIKK Fan Clubs Premium Visual Review
on:
  pull_request:
    paths:
      - 'src/pages/fanclubs.js'
      - 'src/fanclubs-premium.css'
      - 'src/main.js'
      - 'tests/pikk-fanclubs-premium.test.mjs'
      - 'scripts/visual-review-fanclubs.mjs'
      - '.github/workflows/pikk-fanclubs-visual.yml'
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build PIKK
        run: npm run build
      - name: Verify Fan Clubs at 390px and 1440px
        run: node scripts/visual-review-fanclubs.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pikk-fanclubs-visual-review
          path: visual-review/fanclubs-*.png
          if-no-files-found: warn
