name: Dating Visual Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/dating.js'
      - 'src/styles.css'
      - 'scripts/visual-dating-review.mjs'
      - '.github/workflows/dating-visual-review.yml'

permissions:
  contents: read

jobs:
  browser-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_BASE: /pikk-app/
      - name: Review actual Dating route on mobile and desktop
        run: node scripts/visual-dating-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pikk-dating-visual-review
          path: visual-review/*.png
          if-no-files-found: warn
