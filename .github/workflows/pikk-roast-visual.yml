name: PIKK Roast Arena Tap Target Review
on:
  pull_request:
    paths:
      - 'src/pages/roast-arena.js'
      - 'src/roast-engine.js'
      - 'src/*.css'
      - 'src/**/*.css'
      - 'scripts/visual-review-roast-taps.mjs'
      - '.github/workflows/pikk-roast-visual.yml'
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build PIKK
        run: npm run build
      - name: Measure rendered Roast vote/rematch button heights at 360/390/430 (Roast 1v1)
        run: node scripts/visual-review-roast-taps.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pikk-roast-tap-review
          path: visual-review/roast-*.png
          if-no-files-found: warn
